<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영화 리뷰</title>
  <script type="module" crossorigin src="/javascript-movie-review/assets/search-BLiAUcny.js"></script>
  <link rel="modulepreload" crossorigin href="/javascript-movie-review/assets/restoreScrollPosition-R0PUTW3G.js">
  <link rel="stylesheet" crossorigin href="/javascript-movie-review/assets/restoreScrollPosition-CPv-J5u8.css">
</head>

<body>
  <div id="app">
    <div class="header-container container">
      <header class="header">
        <a href="/javascript-movie-review/">
          <img class="logo" src="/javascript-movie-review/images/logo.png" alt="MovieList" />
        </a>
        <form method="get" action="/javascript-movie-review/search" class="search-form">
          <input type="text" name="query" class="search-input" placeholder="검색어를 입력하세요" required />
          <button type="submit" class="search-submit">
            <img src="/javascript-movie-review/svg/search.svg" alt="search" />
          </button>
        </form>
        <div class="header-dummy-item"></div>
      </header>
    </div>
    <div class="container">
      <main>
        <section class="movie-list-section">
          <h2 class="list-title">
            <div class="skeleton skeleton-list-title"></div>
          </h2>
          <ul class="thumbnail-list"></ul>
        </section>
      </main>
    </div>

    <footer class="footer">
      <p>&copy; 우아한테크코스 All Rights Reserved.</p>
      <p><img src="./images/woowacourse_logo.png" alt="woowacourse" width="180" /></p>
    </footer>
  </div>
</body>

</html>
